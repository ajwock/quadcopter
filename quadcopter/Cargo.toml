[package]
edition = "2021"
name    = "quadcopter"
version = "0.1.0"

[[bin]]
name = "quadcopter"
path = "./src/main.rs"

[dependencies]
embassy-net = { version = "0.6.0", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.6.1"
embedded-io-async = "0.6.1"
esp-backtrace = { version = "0.15.1", features = [
  "esp32c3",
  "exception-handler",
  "panic-handler",
  "println",
] }
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", package = "esp-hal", features=["unstable", "esp32c3"] }
esp-hal-embassy = { git = "https://github.com/esp-rs/esp-hal.git", package = "esp-hal-embassy", features=["esp32c3"] }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", package = "esp-alloc" }
esp-wifi = { git = "https://github.com/esp-rs/esp-hal.git", package = "esp-wifi", features=["wifi", "esp32c3"] }
esp-println = { version = "0.13.0", features = ["esp32c3"] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
# for more networking protocol support see https://crates.io/crates/edge-net
bleps = { git = "https://github.com/bjoernQ/bleps", package = "bleps", rev = "a5148d8ae679e021b78f53fd33afb8bb35d0b62e", features = [
  "async",
  "macros",
] }
critical-section = "1.2.0"
embassy-executor = { version = "0.7.0", features = ["task-arena-size-65536"] }
embassy-time = { version = "0.4.0", features = ["generic-queue-8"] }
heapless = { version = "0.8.0", default-features = false }
static_cell = { version = "2.1.0", features = ["nightly"] }
embassy-sync = "0.6.2"
fixed = "1.29.0"
az = "1.2.1"
smallvec = { version = "1.14.0", features = ["const_generics"] }
edge-net = "0.10.1"
edge-http = "0.5.1"
edge-dhcp = "0.5.0"
edge-nal-embassy = "0.5.0"
edge-nal = "0.5.0"
fixed_trigonometry = "0.4.4"
typenum = "1.18.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embassy-futures = "0.1.1"
fixed-macro = "1.2.0"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
