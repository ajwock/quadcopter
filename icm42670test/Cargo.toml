[package]
edition = "2021"
name    = "icm42670test"
version = "0.1.0"

[[bin]]
name = "icm42670test"
path = "./src/bin/main.rs"

[dependencies]
critical-section = "1.2.0"
defmt = "0.3.10"
embassy-executor = { version = "0.7.0", features = [
  "defmt",
  "task-arena-size-20480",
] }
embassy-time = { version = "0.4.0", features = ["generic-queue-8"] }
esp-alloc = "0.7.0"
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", package = "esp-hal", features=["unstable", "esp32c3", "defmt"] }
esp-hal-embassy = { git = "https://github.com/esp-rs/esp-hal.git", package = "esp-hal-embassy", features=["esp32c3"] }

esp-println = { version = "0.13.0", features = ["defmt-espflash", "esp32c3"] }
static_cell = { version = "2.1.0", features = ["nightly"] }
icm42670 = { path = "../icm42670" }
regcomms = { git = "https://github.com/ajwock/regcomms.git", package = "regcomms", features = ["embedded-hal-async"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
