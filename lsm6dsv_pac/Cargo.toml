[package]
name = "lsm6dsv_pac"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
regcommsgen = { git = "https://github.com/ajwock/regcomms.git", package = "regcommsgen" }

[dependencies]
embedded-hal-async = "1.0.0"
regcomms = { git = "https://github.com/ajwock/regcomms.git", package = "regcomms", features = ["embedded-hal-async"] }
spin = { version = "0.10.0", features = ["once", "portable_atomic"] }
